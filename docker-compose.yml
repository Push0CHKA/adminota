version: "3.8"

services:
  app:
    container_name: adminota
    build: ./
    depends_on:
      - db
    command: python run.py
    ports:
      - ${SERVER_PORT}:5000
    env_file:
      - .env
    restart: always

  db:
    container_name: adminota_db
    image: postgres
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - ${DB_PORT}:5432
    volumes:
      - .postgres:/var/lib/postgres/data
    env_file:
      - .env
    restart: always
